name: Build App Nhan

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Tao project
        run: flutter create --org com.example --project-name receive_app receive_build

      - name: Ghi pubspec
        run: |
          cd receive_build
          printf '%s\n' \
            "name: receive_app" \
            "description: Receive App" \
            "publish_to: 'none'" \
            "version: 1.0.0+1" \
            "" \
            "environment:" \
            "  sdk: '>=3.0.0 <4.0.0'" \
            "" \
            "dependencies:" \
            "  flutter:" \
            "    sdk: flutter" \
            "  http: ^1.2.0" \
            "" \
            "dev_dependencies:" \
            "  flutter_test:" \
            "    sdk: flutter" \
            "" \
            "flutter:" \
            "  uses-material-design: true" \
            > pubspec.yaml

      - name: Ghi main.dart
        run: |
          cd receive_build
          cat > lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'dart:async';

          const String FIREBASE_URL = 'https://chat-app-hung-default-rtdb.asia-southeast1.firebasedatabase.app';
          const String EMAILJS_SERVICE_ID = 'service_xd4p0og';
          const String EMAILJS_TEMPLATE_ID = 'template_e75vjj7';
          const String EMAILJS_PUBLIC_KEY = '_ARGVipfVQPmHkUTt';
          const String EMAIL_NHAN = 'hung.luongtien0707@gmail.com';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Nhan tin nhan',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
                home: const ReceiveScreen(),
              );
            }
          }

          class ReceiveScreen extends StatefulWidget {
            const ReceiveScreen({super.key});
            @override
            State<ReceiveScreen> createState() => _ReceiveScreenState();
          }

          class _ReceiveScreenState extends State<ReceiveScreen> {
            List<Map<String, dynamic>> _messages = [];
            Timer? _timer;
            bool _loading = true;
            int _lastCount = 0;
            String _lastError = '';
            final _replyController = TextEditingController();
            final _scrollController = ScrollController();
            Map<String, dynamic>? _replyingTo;
            bool _sending = false;

            @override
            void initState() {
              super.initState();
              _loadMessages();
              _timer = Timer.periodic(const Duration(seconds: 3), (_) => _loadMessages());
            }

            @override
            void dispose() {
              _timer?.cancel();
              _replyController.dispose();
              _scrollController.dispose();
              super.dispose();
            }

            String _now() {
              final n = DateTime.now();
              return '${n.hour}:${n.minute.toString().padLeft(2, '0')}';
            }

            Future<void> _loadMessages() async {
              try {
                final r = await http.get(Uri.parse('$FIREBASE_URL/messages.json'));
                if (r.statusCode == 200) {
                  final data = jsonDecode(r.body);
                  if (data == null) {
                    setState(() { _messages = []; _loading = false; _lastError = ''; });
                    return;
                  }
                  final Map<String, dynamic> map = Map<String, dynamic>.from(data);
                  final list = map.entries.map((e) => {...Map<String, dynamic>.from(e.value), 'id': e.key}).toList();
                  list.sort((a, b) => (a['timestamp'] ?? 0).compareTo(b['timestamp'] ?? 0));
                  setState(() { _messages = list; _loading = false; _lastError = ''; });
                  _lastCount = list.length;
                } else {
                  setState(() { _loading = false; _lastError = 'HTTP ${r.statusCode}'; });
                }
              } catch (e) {
                setState(() { _loading = false; _lastError = '$e'; });
              }
            }

            Future<void> _sendReply() async {
              final text = _replyController.text.trim();
              if (text.isEmpty || _replyingTo == null) return;
              setState(() => _sending = true);
              final replySnapshot = _replyingTo!;
              try {
                await http.post(
                  Uri.parse('$FIREBASE_URL/messages.json'),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode({
                    'user': 'Admin',
                    'text': text,
                    'time': _now(),
                    'timestamp': DateTime.now().millisecondsSinceEpoch,
                    'replyToUser': replySnapshot['user'],
                    'replyToText': replySnapshot['text'],
                  }),
                );
                try {
                  await http.post(
                    Uri.parse('https://api.emailjs.com/api/v1.0/email/send'),
                    headers: {'Content-Type': 'application/json', 'origin': 'http://localhost'},
                    body: jsonEncode({
                      'service_id': EMAILJS_SERVICE_ID,
                      'template_id': EMAILJS_TEMPLATE_ID,
                      'user_id': EMAILJS_PUBLIC_KEY,
                      'template_params': {
                        'from_name': 'Admin Reply',
                        'message': '[Tra loi ' + (replySnapshot['text'] ?? '') + ' cua ' + (replySnapshot['user'] ?? '') + ']\n\n' + text,
                        'time': _now(),
                        'to_email': EMAIL_NHAN,
                      },
                    }),
                  );
                } catch (e) { print('LOI EMAIL: $e'); }
                if (mounted) {
                  setState(() { _replyController.clear(); _replyingTo = null; _sending = false; });
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Da gui reply'), backgroundColor: Colors.green));
                  _loadMessages();
                }
              } catch (e) {
                if (mounted) {
                  setState(() => _sending = false);
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Loi: $e'), backgroundColor: Colors.red));
                }
              }
            }

            Future<void> _clearAll() async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('Xoa tat ca?'),
                  content: const Text('Ban co chac muon xoa het tin nhan?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Huy')),
                    TextButton(onPressed: () => Navigator.pop(context, true), child: const Text('Xoa', style: TextStyle(color: Colors.red))),
                  ],
                ),
              );
              if (ok == true) {
                await http.delete(Uri.parse('$FIREBASE_URL/messages.json'));
                setState(() { _messages = []; _lastCount = 0; });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Nhan tin nhan'),
                  backgroundColor: Colors.green,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh), onPressed: _loadMessages),
                    IconButton(icon: const Icon(Icons.delete), onPressed: _messages.isEmpty ? null : _clearAll),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(12),
                      color: Colors.green.shade50,
                      child: Row(
                        children: [
                          const Icon(Icons.wifi_tethering, color: Colors.green),
                          const SizedBox(width: 8),
                          Expanded(
                            child: Text('Dang lang nghe... (${_messages.length} tin nhan)',
                                style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                          ),
                          if (_loading)
                            const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2, color: Colors.green)),
                        ],
                      ),
                    ),
                    Expanded(
                      child: _messages.isEmpty
                          ? const Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Icon(Icons.inbox, size: 80, color: Colors.grey),
                                  SizedBox(height: 16),
                                  Text('Chua co tin nhan nao', style: TextStyle(fontSize: 16, color: Colors.grey)),
                                ],
                              ),
                            )
                          : RefreshIndicator(
                              onRefresh: _loadMessages,
                              child: ListView.builder(
                                controller: _scrollController,
                                padding: const EdgeInsets.all(12),
                                itemCount: _messages.length,
                                itemBuilder: (_, i) {
                                  final m = _messages[i];
                                  final isReply = m['replyToText'] != null;
                                  return Card(
                                    margin: const EdgeInsets.only(bottom: 10),
                                    elevation: 2,
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(12),
                                      side: BorderSide(color: isReply ? Colors.amber : Colors.green.shade200, width: isReply ? 2 : 1),
                                    ),
                                    child: Padding(
                                      padding: const EdgeInsets.fromLTRB(14, 14, 6, 14),
                                      child: Row(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          Expanded(
                                            child: Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Row(
                                                  children: [
                                                    CircleAvatar(
                                                      radius: 18,
                                                      backgroundColor: Colors.green,
                                                      child: Text((m['user'] ?? '?').toString().substring(0, 1).toUpperCase(),
                                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                                    ),
                                                    const SizedBox(width: 10),
                                                    Expanded(
                                                      child: Column(
                                                        crossAxisAlignment: CrossAxisAlignment.start,
                                                        children: [
                                                          Text(m['user'] ?? 'An danh', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                                                          Text(m['time'] ?? '', style: const TextStyle(fontSize: 11, color: Colors.grey)),
                                                        ],
                                                      ),
                                                    ),
                                                    if (isReply)
                                                      Container(
                                                        padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                                        decoration: BoxDecoration(color: Colors.amber.shade100, borderRadius: BorderRadius.circular(4)),
                                                        child: const Text('Reply', style: TextStyle(fontSize: 10, color: Colors.orange, fontWeight: FontWeight.bold)),
                                                      )
                                                    else
                                                      const Icon(Icons.mark_email_unread, color: Colors.green, size: 20),
                                                  ],
                                                ),
                                                const SizedBox(height: 10),
                                                if (isReply)
                                                  Container(
                                                    width: double.infinity,
                                                    margin: const EdgeInsets.only(bottom: 8),
                                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                                    decoration: BoxDecoration(
                                                      color: Colors.grey[100],
                                                      borderRadius: BorderRadius.circular(8),
                                                      border: const Border(left: BorderSide(color: Colors.indigo, width: 3)),
                                                    ),
                                                    child: Column(
                                                      crossAxisAlignment: CrossAxisAlignment.start,
                                                      children: [
                                                        Text(m['replyToUser'] ?? '', style: const TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Colors.indigo)),
                                                        const SizedBox(height: 2),
                                                        Text(m['replyToText'] ?? '', maxLines: 2, overflow: TextOverflow.ellipsis,
                                                            style: const TextStyle(fontSize: 13, fontStyle: FontStyle.italic, color: Colors.black54)),
                                                      ],
                                                    ),
                                                  ),
                                                Container(
                                                  width: double.infinity,
                                                  padding: const EdgeInsets.all(10),
                                                  decoration: BoxDecoration(color: Colors.grey[100], borderRadius: BorderRadius.circular(8)),
                                                  child: Text(m['text'] ?? '', style: const TextStyle(fontSize: 15)),
                                                ),
                                              ],
                                            ),
                                          ),
                                          Material(
                                            color: Colors.transparent,
                                            child: InkWell(
                                              borderRadius: BorderRadius.circular(20),
                                              onTap: () => setState(() => _replyingTo = m),
                                              child: const Padding(
                                                padding: EdgeInsets.all(6),
                                                child: Icon(Icons.reply, size: 20, color: Colors.green),
                                              ),
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
                            ),
                    ),
                    if (_replyingTo != null)
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        color: Colors.green.shade50,
                        child: Row(
                          children: [
                            Container(width: 3, height: 36, color: Colors.green, margin: const EdgeInsets.only(right: 8)),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text('Dang tra loi ${_replyingTo!['user']}', style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Colors.green)),
                                  const SizedBox(height: 2),
                                  Text(_replyingTo!['text'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 13, color: Colors.black54)),
                                ],
                              ),
                            ),
                            IconButton(icon: const Icon(Icons.close, color: Colors.grey), onPressed: () => setState(() => _replyingTo = null)),
                          ],
                        ),
                      ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(8),
                        child: Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _replyController,
                                enabled: _replyingTo != null && !_sending,
                                decoration: InputDecoration(
                                  hintText: _replyingTo != null ? 'Tra loi ${_replyingTo!['user']}...' : 'Bam nut mui ten de tra loi',
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(24)),
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                                ),
                                onSubmitted: (_) => _sendReply(),
                              ),
                            ),
                            const SizedBox(width: 8),
                            CircleAvatar(
                              radius: 24,
                              backgroundColor: _replyingTo != null ? Colors.green : Colors.grey,
                              child: _sending
                                  ? const Padding(padding: EdgeInsets.all(10), child: CircularProgressIndicator(strokeWidth: 2, color: Colors.white))
                                  : IconButton(icon: const Icon(Icons.send, color: Colors.white), onPressed: _replyingTo != null ? _sendReply : null),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          ENDDART

      - name: Quyen Internet
        run: |
          cd receive_build
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd receive_build
          flutter pub get
          flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-nhan-tin-nhan-apk
          path: receive_build/build/app/outputs/flutter-apk/app-release.apk
