name: Build App Nhan tin nhan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Tạo project Nhan tin nhan
        run: |
          flutter create --org com.example --project-name receive_app receive_app_build
          cd receive_app_build

          cat > pubspec.yaml << 'EOF'
          name: receive_app
          description: Receive Messages
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'dart:async';

          const String FIREBASE_URL = 'https://chat-app-hung-default-rtdb.asia-southeast1.firebasedatabase.app';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Nhan tin nhan',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
                home: const ReceiveScreen(),
              );
            }
          }

          class Message {
            final String id;
            final String user;
            final String text;
            final String time;
            final String from;
            final String? replyToUser;
            final String? replyToText;

            Message({
              required this.id,
              required this.user,
              required this.text,
              required this.time,
              required this.from,
              this.replyToUser,
              this.replyToText,
            });

            bool get isReply => replyToText != null;
          }

          class ReceiveScreen extends StatefulWidget {
            const ReceiveScreen({super.key});
            @override
            State<ReceiveScreen> createState() => _ReceiveScreenState();
          }

          class _ReceiveScreenState extends State<ReceiveScreen> {
            final _controller = TextEditingController();
            final _nameController = TextEditingController(text: 'Nguoi B');
            final _scrollController = ScrollController();
            List<Message> _messages = [];
            Message? _replyingTo;
            Timer? _timer;
            int _lastCount = 0;
            String _lastError = '';

            @override
            void initState() {
              super.initState();
              _loadMessages();
              _timer = Timer.periodic(const Duration(seconds: 3), (_) => _loadMessages());
            }

            @override
            void dispose() {
              _timer?.cancel();
              _scrollController.dispose();
              _controller.dispose();
              _nameController.dispose();
              super.dispose();
            }

            String _now() {
              final n = DateTime.now();
              return '${n.hour}:${n.minute.toString().padLeft(2, '0')}';
            }

            Future<void> _loadMessages() async {
              try {
                final r = await http.get(Uri.parse('$FIREBASE_URL/messages.json'));
                if (r.statusCode == 200) {
                  final data = jsonDecode(r.body);
                  if (data == null) {
                    setState(() {
                      _messages = [];
                      _lastError = '';
                    });
                    return;
                  }
                  final Map<String, dynamic> map = Map<String, dynamic>.from(data);
                  final list = map.entries.map((e) {
                    final v = Map<String, dynamic>.from(e.value);
                    return Message(
                      id: e.key,
                      user: v['user'] ?? 'An danh',
                      text: v['text'] ?? '',
                      time: v['time'] ?? '',
                      from: v['from'] ?? 'chat',
                      replyToUser: v['replyToUser'],
                      replyToText: v['replyToText'],
                    );
                  }).toList();
                  list.sort((a, b) => a.id.compareTo(b.id));
                  setState(() {
                    _messages = list;
                    _lastError = '';
                  });
                  if (list.length > _lastCount && _lastCount > 0) {
                    _scrollToBottom();
                  }
                  _lastCount = list.length;
                } else {
                  setState(() => _lastError = 'HTTP ${r.statusCode}');
                }
              } catch (e) {
                setState(() => _lastError = '$e');
              }
            }

            Future<void> _guiFirebase(Message msg) async {
              try {
                final Map<String, dynamic> payload = {
                  'user': msg.user,
                  'text': msg.text,
                  'time': msg.time,
                  'timestamp': DateTime.now().millisecondsSinceEpoch,
                  'from': 'receive',
                };
                if (msg.isReply) {
                  payload['replyToUser'] = msg.replyToUser;
                  payload['replyToText'] = msg.replyToText;
                }
                final r = await http.post(
                  Uri.parse('$FIREBASE_URL/messages.json'),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode(payload),
                );
                print('GUI STATUS: ${r.statusCode}');
              } catch (e) {
                print('LOI GUI: $e');
              }
            }

            void _send() {
              final text = _controller.text.trim();
              if (text.isEmpty) return;
              final ten = _nameController.text.trim().isEmpty ? 'Nguoi B' : _nameController.text.trim();
              final replySnapshot = _replyingTo;

              final msg = Message(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                user: ten,
                text: text,
                time: _now(),
                from: 'receive',
                replyToUser: replySnapshot?.user,
                replyToText: replySnapshot?.text,
              );

              setState(() {
                _messages.add(msg);
                _replyingTo = null;
              });

              _guiFirebase(msg);
              _controller.clear();
              _scrollToBottom();
            }

            void _scrollToBottom() {
              Future.delayed(const Duration(milliseconds: 100), () {
                if (_scrollController.hasClients) {
                  _scrollController.animateTo(
                    _scrollController.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 200),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            Future<void> _clearAll() async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('Xoa tat ca?'),
                  content: const Text('Ban co chac muon xoa het tin nhan?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Huy')),
                    TextButton(
                        onPressed: () => Navigator.pop(context, true),
                        child: const Text('Xoa', style: TextStyle(color: Colors.red))),
                  ],
                ),
              );
              if (ok == true) {
                await http.delete(Uri.parse('$FIREBASE_URL/messages.json'));
                setState(() {
                  _messages = [];
                  _lastCount = 0;
                });
              }
            }

            Widget _buildMessage(Message m) {
              final isMine = m.from == 'receive';
              return Align(
                alignment: isMine ? Alignment.centerRight : Alignment.centerLeft,
                child: Container(
                  margin: const EdgeInsets.symmetric(vertical: 4),
                  padding: const EdgeInsets.fromLTRB(12, 10, 6, 10),
                  constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.8),
                  decoration: BoxDecoration(
                    color: isMine ? Colors.green : Colors.grey[200],
                    borderRadius: BorderRadius.circular(16),
                  ),
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Flexible(
                        child: Column(
                          crossAxisAlignment: isMine ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Text(m.user,
                                    style: TextStyle(
                                        fontSize: 11,
                                        fontWeight: FontWeight.bold,
                                        color: isMine ? Colors.white70 : Colors.black54)),
                                const SizedBox(width: 6),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 1),
                                  decoration: BoxDecoration(
                                    color: isMine ? Colors.white24 : Colors.indigo.shade100,
                                    borderRadius: BorderRadius.circular(4),
                                  ),
                                  child: Text(
                                    isMine ? 'Nhan' : 'Chat',
                                    style: TextStyle(
                                      fontSize: 9,
                                      color: isMine ? Colors.white : Colors.indigo,
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 4),
                            if (m.isReply)
                              Container(
                                margin: const EdgeInsets.only(bottom: 6),
                                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                decoration: BoxDecoration(
                                  color: isMine ? Colors.white24 : Colors.black12,
                                  borderRadius: BorderRadius.circular(8),
                                  border: Border(
                                    left: BorderSide(
                                      color: isMine ? Colors.amber : Colors.indigo,
                                      width: 3,
                                    ),
                                  ),
                                ),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        Icon(Icons.reply,
                                            size: 12,
                                            color: isMine ? Colors.amber : Colors.indigo),
                                        const SizedBox(width: 4),
                                        Text(m.replyToUser ?? '',
                                            style: TextStyle(
                                                fontSize: 11,
                                                fontWeight: FontWeight.bold,
                                                color: isMine ? Colors.amber : Colors.indigo)),
                                      ],
                                    ),
                                    const SizedBox(height: 2),
                                    Text(m.replyToText ?? '',
                                        maxLines: 2,
                                        overflow: TextOverflow.ellipsis,
                                        style: TextStyle(
                                            fontSize: 13,
                                            fontStyle: FontStyle.italic,
                                            color: isMine ? Colors.white70 : Colors.black54)),
                                  ],
                                ),
                              ),
                            Text(m.text,
                                style: TextStyle(
                                    color: isMine ? Colors.white : Colors.black87, fontSize: 15)),
                            const SizedBox(height: 4),
                            Text(m.time,
                                style: TextStyle(
                                    fontSize: 10,
                                    color: isMine ? Colors.white60 : Colors.black38)),
                          ],
                        ),
                      ),
                      const SizedBox(width: 4),
                      Material(
                        color: Colors.transparent,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(20),
                          onTap: () => setState(() => _replyingTo = m),
                          child: Padding(
                            padding: const EdgeInsets.all(6),
                            child: Icon(Icons.reply,
                                size: 20, color: isMine ? Colors.white70 : Colors.green),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Nhan tin nhan (Nguoi B)'),
                  backgroundColor: Colors.green,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh), onPressed: _loadMessages),
                    IconButton(
                        icon: const Icon(Icons.delete),
                        onPressed: _messages.isEmpty ? null : _clearAll),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(8),
                      color: Colors.green.shade50,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Icon(Icons.wifi_tethering, color: Colors.green, size: 16),
                              const SizedBox(width: 6),
                              Text('Dang lang nghe... (${_messages.length} tin)',
                                  style: const TextStyle(color: Colors.green, fontSize: 12)),
                            ],
                          ),
                          if (_lastError.isNotEmpty)
                            Text('Loi: $_lastError',
                                style: const TextStyle(color: Colors.red, fontSize: 11)),
                        ],
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.all(8),
                      color: Colors.green.shade50,
                      child: TextField(
                        controller: _nameController,
                        decoration: const InputDecoration(
                          labelText: 'Ten cua ban',
                          border: OutlineInputBorder(),
                          isDense: true,
                          contentPadding: EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                        ),
                      ),
                    ),
                    Expanded(
                      child: _messages.isEmpty
                          ? const Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  Icon(Icons.inbox, size: 80, color: Colors.grey),
                                  SizedBox(height: 16),
                                  Text('Chua co tin nhan nao',
                                      style: TextStyle(fontSize: 16, color: Colors.grey)),
                                ],
                              ),
                            )
                          : ListView.builder(
                              controller: _scrollController,
                              padding: const EdgeInsets.all(12),
                              itemCount: _messages.length,
                              itemBuilder: (_, i) => _buildMessage(_messages[i]),
                            ),
                    ),
                    if (_replyingTo != null)
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        color: Colors.green.shade50,
                        child: Row(
                          children: [
                            Container(width: 3, height: 36, color: Colors.green,
                                margin: const EdgeInsets.only(right: 8)),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Row(
                                    children: [
                                      const Icon(Icons.reply, size: 14, color: Colors.green),
                                      const SizedBox(width: 4),
                                      Text('Dang tra loi ${_replyingTo!.user}',
                                          style: const TextStyle(fontSize: 12,
                                              fontWeight: FontWeight.bold, color: Colors.green)),
                                    ],
                                  ),
                                  const SizedBox(height: 2),
                                  Text(_replyingTo!.text,
                                      maxLines: 1, overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(fontSize: 13, color: Colors.black54)),
                                ],
   
